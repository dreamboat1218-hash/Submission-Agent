name: Build Windows App

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-windows.yml"

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 打包后端可执行文件
        working-directory: backend
        shell: pwsh
        run: ./build_windows.ps1 -SkipInstall

      - name: 复制后端到前端工程
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path frontend/backend-bin | Out-Null
          Copy-Item backend/dist/bid-agent-backend.exe frontend/backend-bin/bid-agent-backend.exe -Force
          Get-Item frontend/backend-bin/bid-agent-backend.exe | Select-Object FullName, Length

      - name: 打包 Electron 安装包
        working-directory: frontend
        run: npx electron-builder --win nsis portable --publish never

      - name: 校验打包结果内含后端
        shell: pwsh
        run: |
          $unpacked = Get-ChildItem frontend/release -Directory -Filter "win-*-unpacked" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $unpacked) { throw "未找到 win-*-unpacked 目录，打包未完成" }
          $exe = Join-Path $unpacked.FullName "resources\backend\bid-agent-backend.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "resources 目录内容："
            Get-ChildItem (Join-Path $unpacked.FullName "resources") -Recurse -Depth 2 | Select-Object FullName
            throw "安装包缺少内置后端：$exe"
          }
          Write-Host "校验通过：$exe ($((Get-Item $exe).Length) 字节)"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bid-agent-windows
          path: |
            frontend/release/*.exe
            frontend/release/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: 发布 Release（可直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-win.${{ github.run_number }}
          name: 招投标智能体 Windows 版 v0.1.0 (build ${{ github.run_number }})
          body: |
            自动构建的 Windows 安装包与免安装版。

            - **安装版**：文件名含 `Setup`，双击安装后从开始菜单启动
            - **免安装版**：直接双击 `.exe` 运行，无需安装
            - 内置 Python 后端与前端页面，无需另装 Python / Node / Redis

            构建提交：${{ github.sha }}
          files: |
            frontend/release/*.exe
            frontend/release/*.zip
          draft: false
          prerelease: false
